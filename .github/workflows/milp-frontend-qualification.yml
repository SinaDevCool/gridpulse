name: MILP frontend focused qualification
on:
  push:
    branches: [codex/production-milp-runtime, codex/milp-presentation-corrections]
    paths: [src/**, .github/workflows/milp-frontend-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: milp-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Input identity, mapping and shared result projection first
        run: npx vitest run src/lib/public-milp-session.test.ts src/features/operations/synthetic-milp-request.test.ts src/features/operations/canonical-battery-presentation.test.ts src/features/operations/canonical-job-result.test.ts src/features/operations/canonical-result-projection.test.ts src/features/operations/canonical-input-mapping.test.ts --maxWorkers=2
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm run lint:app
