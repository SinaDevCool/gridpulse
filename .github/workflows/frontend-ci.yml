name: Frontend architecture and regression checks
on:
  pull_request:
    paths:
      [
        "src/**",
        "tests/**",
        "scripts/**",
        "supabase/migrations/**",
        "package*.json",
        "*.config.*",
        ".github/workflows/**",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/validate-candidate.yml
