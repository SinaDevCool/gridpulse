name: Frontend architecture and regression checks
on:
  pull_request:
    paths:
      [
        "src/**",
        "tests/**",
        "scripts/**",
        "supabase/migrations/**",
        "package*.json",
        "*.config.*",
        ".github/workflows/**",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/validate-candidate.yml
  synthetic-preview:
    needs: validate
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/canonical-assessment-contract' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gridpulse-synthetic-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: dist
      - run: node scripts/candidate-artifact.mjs verify
      - name: Upload validated non-production version without deploying production
        run: npx wrangler versions upload --config dist/server/wrangler.json --preview-alias milp-synthetic --message "Synthetic MILP inspection only; production method unchanged" | tee preview-upload.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record preview scope
        run: |
          echo 'Non-production version URL only. No production deployment, customer-input solver, database provisioning or migrations.' >> "$GITHUB_STEP_SUMMARY"
          cat preview-upload.log >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the uploaded preview serves the exact candidate
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const urls = readFileSync('preview-upload.log', 'utf8').match(/https:\/\/[a-zA-Z0-9.-]+\.workers\.dev/g) ?? [];
          const url = urls.find(value => new URL(value).hostname.startsWith('milp-synthetic-')) ?? urls[0];
          if (!url) throw new Error('No accessible Worker version URL was reported');
          const response = await fetch(`${url}/operations`);
          const html = await response.text();
          if (!response.ok || !html.includes(process.env.GITHUB_SHA)) throw new Error('Preview candidate identity not verified');
          console.log(`Verified synthetic-only preview: ${url}/operations`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-preview-upload-${{ github.run_attempt }}
          path: preview-upload.log
          retention-days: 7
