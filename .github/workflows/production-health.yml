name: Production application health

on:
  workflow_dispatch:
    inputs:
      verify_milp:
        description: Submit one real public MILP calculation and check all three tabs
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  application-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production application and backend
        env:
          GRIDPULSE_HEALTH_BASE_URL: https://gridpulseinsights.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-production-health.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check production map in a browser
        env:
          GRIDPULSE_HEALTH_BASE_URL: https://gridpulseinsights.com
        run: node scripts/check-production-map.mjs
      - name: Check real public MILP across Operations tabs
        if: github.event_name == 'workflow_dispatch' && inputs.verify_milp
        run: node scripts/check-production-milp.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-health-failure-${{ github.run_attempt }}
          path: test-results/production-*.png
          if-no-files-found: ignore
          retention-days: 7
