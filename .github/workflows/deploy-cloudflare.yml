name: Deploy GridPulse

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRIDPULSE_BUILD_SHA: ${{ github.sha }}
      GRIDPULSE_BUILD_ENV: production
      GRIDPULSE_PRODUCT_MODE: finder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:operations:database
      - run: npm run grid:test
      - run: npm run grid:audit:release
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npm run check:performance-budgets
      - run: npx playwright install --with-deps chromium
      - name: Validate Operations controls
        run: npx playwright test tests/e2e/activation-operations-ui.spec.ts tests/e2e/operations-redesign-ui.spec.ts tests/e2e/operations-release-controls.spec.ts --workers=1
        env:
          GRIDPULSE_PRODUCT_MODE: full
      - run: npm run test:e2e:finder
        env:
          GRIDPULSE_PRODUCT_MODE: finder
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx wrangler deploy --dry-run
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production application
        env:
          GRIDPULSE_HEALTH_BASE_URL: https://gridpulseinsights.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-production-health.mjs
      - name: Verify production map rendering
        env:
          GRIDPULSE_HEALTH_BASE_URL: https://gridpulseinsights.com
        run: node scripts/check-production-map.mjs
