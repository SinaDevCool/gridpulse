name: Deploy GridPulse
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate-candidate.yml
    with:
      production: true
    secrets:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  publish:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gridpulse-production-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: dist
      - name: Verify exact candidate identity and contents
        run: node scripts/candidate-artifact.mjs verify
      - name: Validate packaged Worker without rebuilding
        run: npx wrangler deploy --config dist/server/wrangler.json --dry-run
      - run: node scripts/candidate-artifact.mjs verify
      - name: Reject an obsolete production candidate
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Publish the validated artifact
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production build identity
        run: |
          node --input-type=module -e 'const r=await fetch("https://gridpulseinsights.com/operations"); const html=await r.text(); if(!r.ok || !html.includes(`name="gridpulse-build" content="${process.env.GITHUB_SHA}"`)) throw new Error("Live build does not match validated candidate");'
      - name: Verify production application
        env:
          GRIDPULSE_HEALTH_BASE_URL: https://gridpulseinsights.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-production-health.mjs
      - name: Verify production map rendering
        env:
          GRIDPULSE_HEALTH_BASE_URL: https://gridpulseinsights.com
        run: node scripts/check-production-map.mjs
