name: Data · Source health

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  mastr-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official MaStR export
        env:
          PYTHONPATH: services/grid-data/src
        run: >-
          python -m grid_data.cli check-mastr
          --output grid-source-health/mastr.json
        if: ${{ !cancelled() }}
      - name: Check national OpenStreetMap extract
        env:
          PYTHONPATH: services/grid-data/src
        run: >-
          python -m grid_data.cli check-geofabrik
          --output grid-source-health/geofabrik-germany.json
        if: ${{ !cancelled() }}
      - name: Snapshot official operator endpoints
        env:
          PYTHONPATH: services/grid-data/src
        run: >-
          python -m grid_data.cli fetch-operator-evidence
          --output grid-source-health/operator-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-source-health
          path: grid-source-health/
          retention-days: 30
