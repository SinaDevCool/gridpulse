name: Python analytics CI

on:
  pull_request:
    paths:
      - "services/grid-data/**"
      - "supabase/migrations/**"
      - ".github/workflows/python-analytics-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/grid-data/**"
      - "supabase/migrations/**"
      - ".github/workflows/python-analytics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./services/grid-data[api,dev]"
      - run: >-
          python -m ruff check
          services/grid-data/src/grid_data/api
          services/grid-data/tests/test_api.py
      - run: >-
          python -m ruff format --check
          services/grid-data/src/grid_data/api
          services/grid-data/tests/test_api.py
      - run: python -m unittest discover -s services/grid-data/tests
        env:
          PYTHONPATH: services/grid-data/src
